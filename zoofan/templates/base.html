<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ZooFanCrawler{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ url_for('index') }}">ZooFanCrawler</a>
        <nav aria-label="Main navigation">
          <a href="{{ url_for('index') }}">Overview</a>
          <a href="{{ url_for('articles') }}">Articles</a>
          <a href="{{ url_for('sources') }}">Sources</a>
          <a href="{{ url_for('runs') }}">Runs</a>
          {% if control_url %}<a href="{{ control_url }}" target="_blank" rel="noopener noreferrer">爬虫控制</a>{% endif %}
        </nav>
      </div>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
